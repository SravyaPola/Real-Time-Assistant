services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: assist
    ports: ["5431:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev", "-d", "assist"]
      interval: 5s
      timeout: 3s
      retries: 50

  backend:
    build: ./packages/backend
    env_file: .env
    environment:
      # ⬇️ hard override to container-to-container hostname
      DATABASE_URL: postgres://dev:dev@db:5432/assist
    depends_on: [db]
    ports: ["8080:8080"]
    volumes:
      - ./packages/backend:/app
      - /app/node_modules

  frontend:
    build: ./packages/frontend
    env_file: .env
    depends_on: [backend]
    ports: ["5173:5173"]
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
